name: Release

# Push a tag like v1.0.0 to build the Windows installer and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Check tag matches version
        shell: pwsh
        run: |
          $version = python -c "import sizeseekerweb; print(sizeseekerweb.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $version" }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: ./packaging/build.ps1
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\SizeSeekerWeb-Setup-*.exe | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $setup.FullName --title "SizeSeekerWeb ${{ github.ref_name }}" --generate-notes
