[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sizeseekerweb"
version = "1.1.0"
description = "See what takes up space on your drives - a local disk usage analyzer in your browser."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Denis Maslov" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pystray>=0.19",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyinstaller>=6.10"]

[project.scripts]
sizeseekerweb = "sizeseekerweb.__main__:main"

[project.urls]
Homepage = "https://github.com/DenisMaslov02/SizeSeekerWeb"

[tool.setuptools]
packages = ["sizeseekerweb"]

[tool.setuptools.package-data]
sizeseekerweb = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
